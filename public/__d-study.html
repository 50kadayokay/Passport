<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>D — Product Portrait study</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" />
<style>
  :root{
    --font:'Switzer',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --accent:#C6F04A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1440px;height:900px;overflow:hidden;}
  body{
    position:relative;font-family:var(--font);
    /* deep ink with a very subtle vertical depth — no glow, no spotlight */
    background:linear-gradient(180deg,#101319 0%,#0b0d12 56%,#090a0e 100%);
  }

  /* ── left editorial ── */
  .copy{position:absolute;left:116px;top:0;width:470px;}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#828a93;}
  h1{margin-top:22px;font-size:48px;font-weight:700;letter-spacing:-.032em;line-height:1.04;color:#f2f3f5;}
  h1 .nb{white-space:nowrap;}
  .lead{margin-top:24px;font-size:16.5px;font-weight:400;line-height:1.52;color:#a7adb6;max-width:360px;}
  .state{margin-top:46px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#c9cfd6;}
  .state .tick{width:18px;height:2px;border-radius:2px;background:var(--accent);}
  .state .n{color:var(--accent);}

  /* ── device (restrained physical frame; bottom exits the frame) ── */
  .phone{
    position:absolute;
    width:424px;height:885px;   /* screen 402 × 863 + 11px bezel; aspect matches 585×1255 */
    background:#0a0a0c;padding:11px;border-radius:48px;
    box-shadow:0 48px 88px -46px rgba(0,0,0,.62);   /* soft, downward, physical — not a glow */
  }
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff;}
  .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
</style>
</head>
<body>
  <!-- text group is vertically centered as a block via top offset -->
  <div class="copy" style="top:332px;">
    <div class="eyebrow">MineEx Pro Profile</div>
    <h1>Your company.<br/><span class="nb">Built for investors.</span></h1>
    <p class="lead">Give investors one place to understand your company, explore your projects and follow your progress.</p>
    <div class="state"><span class="tick"></span><span class="n">01</span>&nbsp;/&nbsp;Overview</div>
  </div>

  <div class="phone" style="right:196px;top:74px;">
    <div class="screen"><img src="/marketing/appshots/overview.webp" alt="MineEx Pro Profile — Overview (Kingsmen Resources)"/></div>
  </div>
</body>
</html>
